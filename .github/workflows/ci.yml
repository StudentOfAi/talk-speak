name: ci
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: venv with pinned deps
        run: python3 -m venv .venv && .venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
      - name: daemon checks (81)
        run: TALK_SPEAK_HOME="$RUNNER_TEMP/state" .venv/bin/python tests/test_talk.py
      - name: unit tests
        run: python3 -m unittest tests.test_speak tests.test_hooks tests.test_cli -v
      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck -x install.sh bin/talk-speak lib/identity.sh talk/app/build.sh speak/*.sh speak/claude-code/*.sh speak/adapters/hermes/*.sh speak/adapters/kimi/kimi-speak.sh speak/adapters/claw/reply
      - name: stub compiles
        run: swiftc -O talk/app/Stub.swift -o "$RUNNER_TEMP/stub"
      - name: VERSION matches the daemon
        run: test "$(tr -d '[:space:]' < VERSION)" = "$(.venv/bin/python talk/talkd.py --version)"
      - name: installer dry run
        run: ./install.sh --dry-run
